<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PJQAQC 正式站登入</title>
  <style>
    :root { color: #18293d; background: #f1f5f9; font: 16px/1.55 system-ui, sans-serif; }
    body { margin: 0; padding: 2rem 1rem; }
    main { max-width: 26rem; margin: 6vh auto; padding: 1.5rem; background: #fff; border: 1px solid #c9d7e4; border-radius: .75rem; }
    h1 { margin: 0; font-size: 1.5rem; }
    form, label { display: grid; gap: .5rem; }
    form { gap: 1rem; }
    input, button { box-sizing: border-box; padding: .65rem; border: 1px solid #6d8499; border-radius: .35rem; font: inherit; }
    button { background: #17466a; color: #fff; cursor: pointer; font-weight: 650; }
    .error { color: #972133; }
  </style>
</head>
<body>
  <main>
    <h1>PJQAQC 正式站</h1>
    <p>請使用已授權的電子郵件帳號登入品管管理系統。</p>
    <!-- login-error -->
    <form action="/login" method="post">
      <label>電子郵件 <input type="email" name="email" autocomplete="username" required maxlength="254"></label>
      <label>密碼 <input type="password" name="password" autocomplete="current-password" required maxlength="1024"></label>
      <button type="submit">登入</button>
    </form>
  </main>
</body>
</html>

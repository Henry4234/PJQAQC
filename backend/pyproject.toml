[project]
name = "pjqaqc-backend"
version = "1.0.0"
description = "QAQC 品管管理系統後端 (FastAPI + MariaDB/PostgreSQL + Claude)"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pymysql==1.1.1",
    "psycopg[binary]==3.3.8",
    "PyJWT[crypto]==2.15.1",
    "python-dotenv==1.0.1",
    "pydantic==2.9.2",
    "anthropic==0.69.0",
]

[tool.uv]
package = false

name: Publish API image

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t pjqaqc:ci .
      - name: Verify the editor boundary inside the image, with no network
        run: |
          docker run --rm -i --network none pjqaqc:ci /app/backend/.venv/bin/python - \
            < backend/test_production.py
      - name: Push to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pjqaqc-api"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$GITHUB_SHA" latest; do
            docker tag pjqaqc:ci "$image:$tag"
            docker push "$image:$tag"
          done
          echo "::notice::Published $image:$GITHUB_SHA. Roll it out on the server as described in DEPLOYMENT.md."

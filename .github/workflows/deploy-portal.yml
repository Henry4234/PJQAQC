name: Deploy portal to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'cloudflare/**'
      - 'tests/**'
      - '.github/workflows/deploy-portal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-portal
  cancel-in-progress: false

jobs:
  deploy:
    # 設定 CLOUDFLARE_ACCOUNT_ID 變數後才會部署，見 DEPLOYMENT.md
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run the Worker and DEMO tests
        run: node --test tests/worker.test.mjs tests/demo-data.test.mjs tests/audit-tables.test.mjs
      # EDGE_SHARED_SECRET 是 Worker secret，已存在 Cloudflare，部署時會保留。
      - name: Deploy the Worker
        run: npx --yes wrangler@4.119.0 deploy --config cloudflare/wrangler.toml

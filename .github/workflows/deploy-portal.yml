name: Deploy portal to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'cloudflare/**'
      - 'tests/**'
      - '.github/workflows/deploy-portal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-portal
  cancel-in-progress: false

jobs:
  deploy:
    # 設定 CLOUDFLARE_ACCOUNT_ID 變數後才會部署，見 DEPLOYMENT.md
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run the Worker and DEMO tests
        run: node --test tests/worker.test.mjs tests/demo-data.test.mjs
      - name: Deploy the Worker
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          args=(deploy --config cloudflare/wrangler.toml)
          if [ -n "$API_ORIGIN" ]; then args+=(--var "API_ORIGIN:$API_ORIGIN"); fi
          npx --yes wrangler@4.119.0 "${args[@]}"
      - name: Set the secret shared with the API
        env:
          EDGE_SHARED_SECRET: ${{ secrets.EDGE_SHARED_SECRET }}
        run: |
          if [ -z "$EDGE_SHARED_SECRET" ]; then
            echo "::notice::EDGE_SHARED_SECRET is not set. DEMO works; editor sign-in returns 503."
            exit 0
          fi
          printf '%s' "$EDGE_SHARED_SECRET" | \
            npx --yes wrangler@4.119.0 secret put EDGE_SHARED_SECRET --config cloudflare/wrangler.toml

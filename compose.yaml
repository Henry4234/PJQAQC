services:
  app:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      APP_ENV: production
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY}
      DATABASE_URL_FILE: /run/secrets/database_url
      SESSION_KEY_FILE: /run/secrets/session_key
      EDGE_SECRET_FILE: /run/secrets/edge_secret
    secrets:
      - database_url
      - session_key
      - edge_secret
      - supabase_ca
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/cloudflared_token]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - cloudflared_token

secrets:
  database_url:
    file: ./secrets/database_url
  edge_secret:
    file: ./secrets/edge_secret
  session_key:
    file: ./secrets/session_key
  supabase_ca:
    file: ./secrets/supabase_ca
  cloudflared_token:
    file: ./secrets/cloudflared_token

name = "pjqaqc"
main = "worker.mjs"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = false

# 靜態前端直接由 Static Assets 回應，不計入 Worker 請求額度；只有 /api/* 會執行 Worker。
[assets]
directory = "../frontend"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "API_LIMIT"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 300
  period = 60

# 後端的連線設定見 DEPLOYMENT.md。API_ORIGIN 由部署流程帶入，EDGE_SHARED_SECRET 是 Worker secret。
# 沒有設定時 DEMO 仍可正常使用，只有編輯者登入會回 503。
#
# 若經 Workers VPC 連到 Tunnel（不需網域、後端沒有公開網址），取消註解並填入 service id：
# [[vpc_services]]
# binding = "API_VPC"
# service_id = "<wrangler vpc service create 回傳的 id>"
